<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partie — ROOOK</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/chessground-assets/chessground.base.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-game">
  <header class="topbar">
    <a class="logo" href="./"><span class="logo-mark">♜</span> ROOOK</a>
    <nav class="topnav">
      <a href="jouer.html">Jouer</a>
      <a href="amis.html">Amis</a>
      <a href="bilan.html">Analyser</a>
    </nav>
    <div class="topbar-right">
      <span class="mode-label" id="mode-label"></span>
      <button class="icon-btn sound-toggle" id="sound-toggle" type="button" title="Couper le son">🔊</button>
    </div>
  </header>

  <main class="game-layout">
    <section class="board-col">
      <div class="player" id="p-top"></div>
      <div class="board-frame">
        <div id="board" class="cg-wrap board"></div>
        <div class="thinking" id="thinking" hidden><span></span><span></span><span></span></div>
      </div>
      <div class="player" id="p-bottom"></div>
    </section>

    <aside class="side">
      <div class="card status-card" id="status"></div>

      <div class="banner" id="draw-banner" hidden>
        <span id="draw-text"></span>
        <div><button class="btn btn-primary small" id="draw-accept">Accepter</button>
        <button class="btn btn-ghost small" id="draw-decline">Refuser</button></div>
      </div>

      <div class="card moves-card">
        <div class="moves-head">
          <h2>Coups</h2>
          <div class="nav">
            <button class="icon-btn" data-nav="first" title="Début">⏮</button>
            <button class="icon-btn" data-nav="prev" title="Précédent (←)">◀</button>
            <button class="icon-btn" data-nav="next" title="Suivant (→)">▶</button>
            <button class="icon-btn" data-nav="last" title="Position actuelle">⏭</button>
          </div>
        </div>
        <ol class="moves" id="moves"></ol>
      </div>

      <div class="actions" id="actions">
        <button class="btn btn-ghost" id="btn-draw" hidden>½ Proposer nulle</button>
        <button class="btn btn-ghost" id="btn-flip">⇅ Tourner</button>
        <button class="btn btn-danger" id="btn-resign">⚑ Abandonner</button>
      </div>

      <div class="card chat" id="chat" hidden>
        <h2>Discussion</h2>
        <div class="chat-log" id="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" maxlength="300" placeholder="Écris un message…" autocomplete="off">
          <button class="btn btn-primary small">Envoyer</button>
        </form>
      </div>
    </aside>
  </main>

  <dialog id="end-dialog" class="modal">
    <div class="end-icon" id="end-icon">♚</div>
    <h2 id="end-title"></h2>
    <p id="end-sub"></p>
    <div class="end-actions">
      <a class="btn btn-primary" id="end-review">📊 Voir le bilan</a>
      <button class="btn btn-ghost" id="end-rematch">Revanche</button>
      <a class="btn btn-ghost" href="./">Accueil</a>
    </div>
    <button class="modal-close" id="end-close" aria-label="Fermer">×</button>
  </dialog>


  <script type="module" src="js/jeu.js"></script>
</body>
</html>
