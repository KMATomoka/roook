<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e0b1c">
  <title>Hors ligne — ROOOK</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/appli/apple-touch-icon.png?h=c739bfd4ab">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ROOOK">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    /* Page autonome : affichée par l'appli quand il n'y a pas de connexion (voir sw.js) */
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 30%, #221d3b, #0c0a16 70%); color: #eeeaf8;
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
    }
    main { max-width: 360px; }
    .icone { border-radius: 24px; box-shadow: 0 0 40px rgba(143, 107, 255, 0.45); }
    h1 { font: 800 1.7rem 'Oxanium', system-ui, sans-serif; margin: 22px 0 8px; letter-spacing: 0.02em; }
    p { color: #9690ad; line-height: 1.55; margin: 0 0 22px; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #8f6bff; border: 0; border-radius: 10px;
      padding: 12px 22px; cursor: pointer;
    }
    button:hover { background: #a387ff; }
  </style>
<script>
(function () {
  var v = 'f4cd128-mwquidh7';
  // Après une mise à jour, on retire le petit paramètre « maj » de l'adresse
  try {
    var here = new URL(location.href);
    if (here.searchParams.has('maj')) { here.searchParams.delete('maj'); history.replaceState(history.state, '', here.toString()); }
  } catch (e) {}
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || d.v === v) return;
    var key = 'roook-maj-' + d.v;
    try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { return; }
    // Recharge vers une adresse neuve (?maj=…) : le navigateur ne peut pas resservir l'ancienne page de son cache
    try {
      var u = new URL(location.href);
      u.searchParams.set('maj', d.v);
      location.replace(u.toString());
    } catch (e) { location.reload(); }
  }).catch(function () {});
})();
</script>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="icone" width="96" height="96" aria-hidden="true"><defs><linearGradient id="fond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a6ff"/><stop offset="0.55" stop-color="#8f6bff"/><stop offset="1" stop-color="#5a3ad6"/></linearGradient><radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><filter id="ombre" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.20" stdDeviation="1.35" flood-color="#1a1035" flood-opacity="0.4"/></filter></defs><rect width="100" height="100" fill="url(#fond)"/><circle cx="50" cy="50" r="51.00" fill="url(#halo)"/><g filter="url(#ombre)" transform="translate(7.33 7.33) scale(1.3333)"><g fill="#ffffff"><path d="M16 7.5 Q16 6.5 17 6.5 H22.5 Q23.5 6.5 23.5 7.5 V11 H28.5 V7.5 Q28.5 6.5 29.5 6.5 H34.5 Q35.5 6.5 35.5 7.5 V11 H40.5 V7.5 Q40.5 6.5 41.5 6.5 H47 Q48 6.5 48 7.5 V17.5 H16 Z"/><path d="M18.5 19 H45.5 L42 23 H22 Z"/><path d="M22.6 24.5 H41.4 L43.4 43 H20.6 Z"/><path d="M19 44.5 H45 L47.5 49.5 H16.5 Z"/><rect x="12.5" y="51" width="39" height="6.5" rx="2"/></g></g></svg>
    <h1>Pas de connexion</h1>
    <p>ROOOK a besoin d’Internet pour tes parties, tes amis et tes coffres. Vérifie ta connexion, puis réessaie.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
